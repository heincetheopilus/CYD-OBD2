; CarCYD OBD2 - PlatformIO project (Arduino-ESP32 core 3.x, LVGL 9, LovyanGFX)
;
;   pio run                      build env "classic" (default)
;   pio run -t upload            flash over USB
;   pio device monitor           serial log (115200)
;
; The official "espressif32" platform is still on Arduino core 2.x, which this
; project rejects (#error in app.cpp). pioarduino provides core 3.x.
;
; There is no "sim" env here: the PC simulator is built by tools/simulator/build.py
; (zig/gcc), it does not go through PlatformIO. Host unit tests: tools/tests/*.sh.

[platformio]
default_envs = classic
src_dir = CarCYD

; Notes
;  - -I CarCYD lets LVGL find CarCYD/lv_conf.h.
;  - Bluetooth Classic (BluetoothSerial/SPP) ships with the Arduino-ESP32 core: the prebuilt
;    esp32dev sdkconfig has CONFIG_BT_ENABLED + CONFIG_BT_SPP_ENABLED (Bluedroid).
;  - huge_app = 3 MB app partition, no OTA (Bluetooth + LVGL + media).
;  - Panel variant defaults live in CarCYD/src/config/board_config.h (CYD 2-USB = ILI9341_2);
;    override with -DCYD_PANEL=... -DCYD_PANEL_INVERT=... if needed.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32dev
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
    lvgl/lvgl@^9.6.0
    lovyan03/LovyanGFX@^1.2.0
build_unflags = -std=gnu++11 -Os
build_flags =
    -std=gnu++17
    -O2
    -I CarCYD
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0

; Normal firmware: Bluetooth Classic ELM327 (or Demo from Settings > Connection).
[env:classic]

; Same firmware with debug logging (APP_LOG_LEVEL 3: per-PID OBD details).
[env:classic_debug]
build_flags =
    ${env.build_flags}
    -DAPP_LOG_LEVEL=3

; Debug harness: serial '0'..'5' = navigate, 'a' = auto-cycle pages, loop timing report each second.
[env:classic_harness]
build_flags =
    ${env.build_flags}
    -DAPP_UI_HARNESS=1
